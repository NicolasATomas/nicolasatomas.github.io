<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIADOS</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>

    <!-- BACKGROUND -->
    <div class="bg-overlay"></div>

    <!-- LOGO -->
    <div class="container-1">
      <img src="images/logo.png" alt="DIADOS Logo" class="logo">
    </div>

    <!-- FORM -->
    <div class="container-2">

      <h2>GET IN EARLY:</h2>

      <form name="submit-to-google-sheet">
        <div class="row">
          <div class="column">

            <input
              type="tel"
              name="Phone"
              placeholder="Mobile Number"
              required
            >

            <input
              type="email"
              name="Email"
              placeholder="Email (Optional)"
            >

            <button type="submit">SUBMIT</button>

          </div>
        </div>
      </form>

    <span id="msg" class="pop-up"></span>
    <div class="social-media">
        <div class="fade-in">
            <a href="https://open.spotify.com/user/31f6vbpzrl2knl2jtgaxg2ax7jge?si=50f9e2c901ac4b00"><img src="images/spotify.png" alt="Spotify Logo" style="width: 25px;"></a>
            <a href="https://www.instagram.com/diadosofficial?igsh=cmI4c2F3dWh2enMz&utm_source=qr"><img src="images/instagram.png" alt="Instagram Logo" style="width: 25px;"></a>
            <a href="https://www.youtube.com/@diadosofficial"><img src="images/youtube.png" alt="YouTube Logo" style="width: 25px;"></a>
        </div>
    </div>
</div>
   

    <script src="script.js"></script>

  </body>
</html>
